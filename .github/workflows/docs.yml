name: Package user documentation

on:
  pull_request:
  push:
    branches: [main]
    tags: ['docs-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Validate local links and package
        run: |
          python3 scripts/check-user-docs.py
          python3 scripts/yueli_docs_publish.py pack content --output artifacts/docs.zip
          cp release.json artifacts/release.json
          cd artifacts
          sha256sum docs.zip release.json > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: yotta-documentation
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/docs-')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: yotta-documentation
          path: artifacts
      - name: Publish documentation release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd artifacts
          sha256sum --check SHA256SUMS
          gh release create "$RELEASE_TAG" docs.zip release.json SHA256SUMS \
            --verify-tag --title "Yotta documentation $RELEASE_TAG" --generate-notes
